name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Yayinlanacak etiket (bos birakilirsa v<surum> kullanilir)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: arac bagimliliklari
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          command -v dpkg-scanpackages >/dev/null || sudo apt-get install -y -qq dpkg-dev

      - name: lint + testler
        run: |
          make lint
          make check

      - id: ver
        run: echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - name: yayin etiketini belirle
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${{ steps.ver.outputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Yayin etiketi: $tag"

      - name: .deb uret
        run: |
          make deb
          dpkg-deb -I dist/aify_*_all.deb

      - name: apt deposunu uret
        run: |
          packaging/build-apt-repo.sh --out site \
            --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      - name: apt deposunu dogrula (gercek apt ile)
        run: |
          set -eux
          T=$(mktemp -d); mkdir -p "$T/lists/partial" "$T/cache/archives/partial" "$T/dpkg"
          touch "$T/dpkg/status"
          echo "deb [trusted=yes] file://$PWD/site aify main" > "$T/sources.list"
          opts="-o Dir::Etc::sourcelist=$T/sources.list -o Dir::Etc::sourceparts=-"
          opts="$opts -o Dir::State::lists=$T/lists -o Dir::State::status=$T/dpkg/status"
          opts="$opts -o Dir::Cache=$T/cache -o APT::Architecture=aarch64"
          opts="$opts -o APT::Architectures=aarch64 -o Acquire::Languages=none"
          # shellcheck disable=SC2086
          apt-get $opts update
          # shellcheck disable=SC2086
          apt-cache $opts policy aify | grep "Candidate: ${{ steps.ver.outputs.version }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: etiketi olustur (yoksa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag zaten var"
          else
            git tag -a "$tag" -m "aify $tag"
            git push origin "$tag"
            echo "$tag olusturuldu"
          fi

      - name: surum notlari
        run: |
          repo="$GITHUB_REPOSITORY"
          pages="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          ver="${{ steps.ver.outputs.version }}"
          {
            echo "## Kurulum"
            echo
            echo "apt deposundan (onerilen):"
            echo '```bash'
            echo "echo \"deb [trusted=yes] $pages aify main\" > \$PREFIX/etc/apt/sources.list.d/aify.list"
            echo "pkg update && pkg install aify"
            echo '```'
            echo
            echo "Ya da dogrudan .deb ile:"
            echo '```bash'
            echo "curl -fLO https://github.com/$repo/releases/download/${{ steps.tag.outputs.tag }}/aify_${ver}_all.deb"
            echo "apt install ./aify_${ver}_all.deb"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: surumu yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/aify_*_all.deb --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" dist/aify_*_all.deb \
              --title "aify $tag" --notes-file release-notes.md
          fi

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
