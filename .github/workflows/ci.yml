name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Ayni dala yeni bir push geldiginde eskisinin sonucunu beklemeye gerek yok.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # strace: testlerdeki surec butcesi (fork sayisi) denetimi icin
      - name: arac bagimliliklari
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          command -v strace >/dev/null || sudo apt-get install -y -qq strace

      - name: shellcheck
        run: make lint

      - name: testler
        run: make check

      - name: .deb uret
        run: make deb

      - name: paket icerigi
        run: |
          deb=$(ls dist/aify_*_all.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: aify-deb
          path: dist/*.deb
          if-no-files-found: error
